[package]
name = "restguard"
version = "0.1.18"
description = "Cross-platform break reminder that actually makes you rest"
authors = ["Tanzi"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/HansTanzi/RestGuard"
homepage = "https://hanstanzi.github.io/RestGuard/"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "restguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
# Picks a sound file for the settings panel; only called from the backend, so the frontend needs no permission
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sys-locale = "0.3"
# Local time of day, for holding off breaks just before the end of the working day
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Push to the phone via ntfy when a break ends. Uses the OS TLS stack and root certificates (SChannel, Security.framework, OpenSSL)
# instead of the default rustls + ring + bundled roots, which added about 1.4 MB to the binary
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

# Same version as tauri uses; raises the overlay above the menu bar and full-screen apps, and detects the frontmost app, running apps and microphone use
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSWorkspace", "NSRunningApplication"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }

# Same version as tauri uses; for Store (MSIX) autostart, detecting the foreground app and microphone use, idle detection, opening the config file, and playing sounds
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["ApplicationModel", "Foundation", "Media_Core", "Media_Playback", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
