# Weekly dependency update PRs against dev; each one runs through .github/workflows/dependencies.yml.
# cooldown holds back versions younger than a week (security updates are exempt), so a hijacked release
# is usually spotted and pulled before it gets proposed here. Same idea as minimumReleaseAge in pnpm-workspace.yaml
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
