name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -ne $conf) { throw "Tag $version does not match tauri.conf.json version $conf" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - run: pnpm install --frozen-lockfile

      # Scoop 安装便携版 exe，不需要安装包
      - run: pnpm tauri build --no-bundle

      - name: Prepare asset
        id: asset
        shell: pwsh
        run: |
          $name = "RestGuard_${{ steps.version.outputs.version }}_x64.exe"
          Copy-Item src-tauri/target/release/restguard.exe $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "name=$name" >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.asset.outputs.name }}
          generate_release_notes: true

      # 微软商店包：未签名（由商店签名），不放进 Release，作为构建产物供手动上传到合作伙伴中心。
      # 商店不支持预发布版本号，预发布版本跳过
      - name: Build MSIX
        if: ${{ !contains(github.ref_name, '-') }}
        shell: pwsh
        run: ./scripts/msix.ps1 -SkipBuild

      - uses: actions/upload-artifact@v4
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          name: msix
          path: src-tauri/target/msix/*.msix

      # dev 受规则保护（只能走 PR），用在 bypass 列表中的 deploy key 推送
      # 私钥有密码或格式不对时 ssh 会无限等待输入，用超时让它尽快失败
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: default-branch
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Update Scoop manifest
        shell: pwsh
        working-directory: default-branch
        run: |
          $path = "bucket/restguard.json"
          $manifest = Get-Content $path -Raw | ConvertFrom-Json
          $manifest.version = "${{ steps.version.outputs.version }}"
          $manifest.architecture."64bit".url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.asset.outputs.name }}#/RestGuard.exe"
          $manifest.architecture."64bit".hash = "${{ steps.asset.outputs.hash }}"
          ($manifest | ConvertTo-Json -Depth 10) + "`n" | Set-Content $path -NoNewline
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path
          git diff --cached --quiet || git commit -m "scoop: restguard ${{ steps.version.outputs.version }}"
          git push

      # 向 microsoft/winget-pkgs 提交新版本 PR。首个版本需手动提交（见 README），
      # 需要仓库 secret WINGET_TOKEN（classic PAT，public_repo 权限），预发布版本跳过
      - uses: vedantmgoyal9/winget-releaser@v2
        if: ${{ env.WINGET_TOKEN != '' && !contains(github.ref_name, '-') }}
        with:
          identifier: HansTanzi.RestGuard
          version: ${{ steps.version.outputs.version }}
          release-tag: ${{ github.ref_name }}
          installers-regex: '_x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  # 排在 windows 之后：由 windows 创建 Release、校验版本号，也避免两边同时推送 dev
  macos:
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # 同时支持 Apple Silicon 和 Intel 的通用版 .app
      - run: pnpm tauri build --target universal-apple-darwin --bundles app

      - name: Prepare asset
        id: asset
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="RestGuard_${version}_universal.zip"
          ditto -c -k --keepParent src-tauri/target/universal-apple-darwin/release/bundle/macos/RestGuard.app "$name"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "hash=$(shasum -a 256 "$name" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.asset.outputs.name }}

      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: default-branch
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Update Homebrew cask
        working-directory: default-branch
        run: |
          path="Casks/restguard.rb"
          sed -i '' -E \
            -e 's/^(  version ")[^"]+/\1${{ steps.asset.outputs.version }}/' \
            -e 's/^(  sha256 ")[^"]+/\1${{ steps.asset.outputs.hash }}/' \
            "$path"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git diff --cached --quiet || git commit -m "brew: restguard ${{ steps.asset.outputs.version }}"
          git push

  # 排在 windows 之后，等 Release 建好再上传产物
  linux:
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 的 Linux 构建依赖：webkit2gtk、托盘用的 appindicator、AppImage 打包用的 patchelf 等
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # x86_64 的 AppImage（几乎全发行版通用）和 .deb（Debian/Ubuntu）
      - run: pnpm tauri build --bundles appimage deb

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
