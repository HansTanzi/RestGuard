# Verifies at PR time that Linux builds the .deb, .rpm and Arch packages, surfacing system dependency issues early;
# uploads nothing. Actual releases are handled by the linux job in release.yml.
name: Linux build check

on:
  pull_request:
    branches: [dev, main, master]
    # Changes only to docs or the release workflow don't affect the Linux build, so skip
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
      - ".vscode/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# Cancel older runs still in progress when a PR gets new pushes
concurrency:
  group: linux-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build --bundles deb rpm

      - run: bash scripts/arch-package.sh "$(jq -r .version src-tauri/tauri.conf.json)"
