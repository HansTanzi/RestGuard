# 在 PR 阶段验证 Linux 能正常打出 AppImage + .deb，提前暴露系统依赖等问题，
# 不上传任何产物。正式发布由 release.yml 的 linux job 负责。
name: Linux build check

on:
  pull_request:
    branches: [dev, main, master]
    # 只改文档或发布流程时，不影响 Linux 构建，跳过
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
      - ".vscode/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# 同一个 PR 连续推送时，取消还在跑的旧检查
concurrency:
  group: linux-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            wget

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build --bundles appimage deb
