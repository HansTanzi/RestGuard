name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Two stages:
# 1. build-*: compile and upload the GitHub Release files. Skipped when the files already exist: builds aren't reproducible, so rebuilding would change hashes
#    and break checksum verification of channel manifests already updated
# 2. Distribution channels (scoop, homebrew, apt, winget, msix): one independent job each, downloading files only from the Release;
#    each checks whether its channel needs updating. As long as the platform's Release files are ready, one channel failing doesn't affect the others
jobs:
  # Validate the version, make sure the Release exists (so the two build jobs needn't wait on each other), and check which platforms' files are already uploaded
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      windows_exists: ${{ steps.check.outputs.windows_exists }}
      macos_exists: ${{ steps.check.outputs.macos_exists }}
      linux_exists: ${{ steps.check.outputs.linux_exists }}
    steps:
      - uses: actions/checkout@v7

      - name: Check version and existing assets
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$version" != "$conf" ]; then
            echo "::error::Tag $version does not match tauri.conf.json version $conf"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          # Skip a platform's build only if all of its files already exist
          check() {
            platform="$1"; shift
            for name in "$@"; do
              if ! grep -qxF "$name" <<< "$assets"; then
                echo "${platform}_exists=false" >> "$GITHUB_OUTPUT"
                return
              fi
            done
            echo "::notice::$* already exist in release $GITHUB_REF_NAME, skipping $platform build"
            echo "${platform}_exists=true" >> "$GITHUB_OUTPUT"
          }
          check windows "RestGuard_${version}_x64.exe"
          check macos "RestGuard_${version}_universal.zip"
          check linux "RestGuard_${version}_amd64.deb" "RestGuard_${version}_x86_64.rpm" "RestGuard_${version}_x86_64.pkg.tar.zst"

  build-windows:
    needs: prepare
    if: needs.prepare.outputs.windows_exists == 'false'
    runs-on: windows-latest
    # id-token and attestations are for the build provenance attestation
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Scoop installs the portable exe, no installer needed
      - run: pnpm tauri build --no-bundle

      - name: Rename asset
        shell: pwsh
        run: Copy-Item src-tauri/target/release/restguard.exe "RestGuard_${{ needs.prepare.outputs.version }}_x64.exe"

      # Signed provenance tying the file's hash to this workflow run and commit; users verify with gh attestation verify
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: RestGuard_${{ needs.prepare.outputs.version }}_x64.exe

      # No --clobber: upload fails if the file exists, never overwriting published files
      - name: Upload asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "RestGuard_${{ needs.prepare.outputs.version }}_x64.exe"
          gh release upload "${{ github.ref_name }}" $name
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload $name" }

  build-macos:
    needs: prepare
    if: needs.prepare.outputs.macos_exists == 'false'
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Universal .app for both Apple Silicon and Intel
      - run: pnpm tauri build --target universal-apple-darwin --bundles app

      - name: Zip app
        run: ditto -c -k --keepParent src-tauri/target/universal-apple-darwin/release/bundle/macos/RestGuard.app "RestGuard_${{ needs.prepare.outputs.version }}_universal.zip"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: RestGuard_${{ needs.prepare.outputs.version }}_universal.zip

      # No --clobber: upload fails if the file exists, never overwriting published files
      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "RestGuard_${{ needs.prepare.outputs.version }}_universal.zip"

  build-linux:
    needs: prepare
    if: needs.prepare.outputs.linux_exists == 'false'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # Linux build dependencies for Tauri v2: webkit2gtk, appindicator for the tray, etc.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # x86_64 .deb (Debian/Ubuntu) and .rpm (Fedora/openSUSE), both using the system webkit2gtk
      - run: pnpm tauri build --bundles deb rpm

      # The README and HansTanzi/apt say apt install rest-guard (the package name Tauri derives from productName); update the docs if it changes
      - name: Check deb package name
        run: |
          package=$(dpkg-deb -f "src-tauri/target/release/bundle/deb/RestGuard_${{ needs.prepare.outputs.version }}_amd64.deb" Package)
          if [ "$package" != "rest-guard" ]; then
            echo "::error::Package name is $package, expected rest-guard; update the apt install commands in the READMEs"
            exit 1
          fi

      # Arch .pkg.tar.zst, repackaged from the .deb
      - run: bash scripts/arch-package.sh "${{ needs.prepare.outputs.version }}"

      # Tauri names the rpm RestGuard-<version>-1.x86_64.rpm; rename it to match the other platforms
      - name: Rename rpm
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          rpms=(src-tauri/target/release/bundle/rpm/*.rpm)
          if [ "${#rpms[@]}" != 1 ]; then
            echo "::error::Expected exactly one rpm, found: ${rpms[*]}"
            exit 1
          fi
          cp "${rpms[0]}" "RestGuard_${VERSION}_x86_64.rpm"

      # Attests all three; a file already on the Release isn't uploaded below, so its attestation here just goes unused
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            src-tauri/target/release/bundle/deb/RestGuard_${{ needs.prepare.outputs.version }}_amd64.deb
            RestGuard_${{ needs.prepare.outputs.version }}_x86_64.rpm
            RestGuard_${{ needs.prepare.outputs.version }}_x86_64.pkg.tar.zst

      # Upload only files not yet on the Release (e.g. only one succeeded last time); no --clobber, never overwrite
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for file in \
            "src-tauri/target/release/bundle/deb/RestGuard_${VERSION}_amd64.deb" \
            "RestGuard_${VERSION}_x86_64.rpm" \
            "RestGuard_${VERSION}_x86_64.pkg.tar.zst"; do
            if grep -qxF "$(basename "$file")" <<< "$assets"; then
              echo "::notice::$(basename "$file") already exists, not uploading"
            else
              gh release upload "$GITHUB_REF_NAME" "$file"
            fi
          done

  # SHA256SUMS.txt for users verifying manual downloads (sha256sum -c), hashed from the files on the Release rather than the local build output.
  # Waits for all platforms so the file covers every asset. If it already exists, check it still matches instead of overwriting
  checksums:
    needs: [prepare, build-windows, build-macos, build-linux]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.build-windows.result) && contains(fromJSON('["success", "skipped"]'), needs.build-macos.result) && contains(fromJSON('["success", "skipped"]'), needs.build-linux.result) }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate and upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd "$RUNNER_TEMP"
          files=(
            "RestGuard_${VERSION}_x64.exe"
            "RestGuard_${VERSION}_universal.zip"
            "RestGuard_${VERSION}_amd64.deb"
            "RestGuard_${VERSION}_x86_64.rpm"
            "RestGuard_${VERSION}_x86_64.pkg.tar.zst"
          )
          for name in "${files[@]}"; do
            gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --pattern "$name"
          done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

          assets=$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if grep -qxF SHA256SUMS.txt <<< "$assets"; then
            gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --output published.txt
            if ! cmp -s SHA256SUMS.txt published.txt; then
              echo "::error::SHA256SUMS.txt on the Release doesn't match the current assets"
              exit 1
            fi
            echo "::notice::SHA256SUMS.txt already exists and matches"
          else
            gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" SHA256SUMS.txt
          fi

  # Update HansTanzi/scoop-bucket (the bucket users add) directly, so the release is available immediately without waiting for its scheduled Excavator.
  # Pushes to its default branch with that repo's deploy key (secret SCOOP_BUCKET_DEPLOY_KEY, write access required).
  # Doesn't commit if the manifest already has this version and hash (e.g. Excavator got there first).
  # Only the version, url and hash text is replaced, keeping Excavator's JSON formatting so the two don't keep reformatting each other.
  # If the push is rejected (Excavator committed at the same time), reset to the latest remote and redo the edit rather than rebasing (both touch the same lines and would conflict)
  scoop:
    needs: [prepare, build-windows]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.build-windows.result) }}
    runs-on: ubuntu-latest
    steps:
      # ssh waits for input forever if the private key has a passphrase or a bad format; a timeout makes it fail fast
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          repository: HansTanzi/scoop-bucket
          ssh-key: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}

      - name: Update Scoop manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $name = "RestGuard_${env:VERSION}_x64.exe"
          gh release download "${{ github.ref_name }}" -R "${{ github.repository }}" --pattern $name --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "Failed to download $name" }
          $hash = (Get-FileHash "$env:RUNNER_TEMP/$name" -Algorithm SHA256).Hash.ToLower()
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$name#/RestGuard.exe"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $path = "bucket/restguard.json"
          for ($i = 1; $i -le 5; $i++) {
            git fetch origin
            git reset --hard "@{u}"
            if ($LASTEXITCODE -ne 0) { throw "git reset failed" }

            # The url in autoupdate contains $version, so the url replacement won't match it
            $text = Get-Content $path -Raw
            $text = $text -replace '(?m)^(\s*"version":\s*")[^"]*', "`${1}$env:VERSION"
            $text = $text -replace '(?m)^(\s*"url":\s*")[^"$]*(")', "`${1}$url`${2}"
            $text = $text -replace '(?m)^(\s*"hash":\s*")[^"]*', "`${1}$hash"
            $manifest = $text | ConvertFrom-Json
            if ($manifest.version -ne $env:VERSION -or $manifest.architecture."64bit".url -ne $url -or $manifest.architecture."64bit".hash -ne $hash) {
              throw "Failed to update $path, check its format"
            }
            Set-Content $path $text -NoNewline

            git add $path
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { Write-Host "::notice::$path is already at $env:VERSION"; break }
            git commit -m "restguard: Update to version $env:VERSION"
            git push
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 5) { throw "git push failed" }
            Start-Sleep 5
          }

  # Update HansTanzi/homebrew-tap (the tap users add) directly, pushing to its default branch with that repo's deploy key
  # (secret HOMEBREW_TAP_DEPLOY_KEY, write access required).
  # If the cask already has this version and hashes, git diff is empty and nothing is committed; if the push is rejected, rebase and retry.
  # The same cask installs the .app on macOS and takes usr/bin/restguard from the Arch package on Linux with a shared version, so it waits for both platforms
  homebrew:
    needs: [prepare, build-macos, build-linux]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.build-macos.result) && contains(fromJSON('["success", "skipped"]'), needs.build-linux.result) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          repository: HansTanzi/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sha() {
            gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --pattern "$1" --dir "$RUNNER_TEMP"
            sha256sum "$RUNNER_TEMP/$1" | cut -d ' ' -f 1
          }
          mac_hash=$(sha "RestGuard_${VERSION}_universal.zip")
          linux_hash=$(sha "RestGuard_${VERSION}_x86_64.pkg.tar.zst")

          # The two sha256 values live in the on_macos and on_linux blocks; replace each within its block
          path="Casks/restguard.rb"
          sed -i -E \
            -e "s/^(  version \")[^\"]+/\1${VERSION}/" \
            -e "/^  on_macos do/,/^  end/ s/^(    sha256 \")[^\"]+/\1${mac_hash}/" \
            -e "/^  on_linux do/,/^  end/ s/^(    sha256 \")[^\"]+/\1${linux_hash}/" \
            "$path"
          if ! grep -qxF "  version \"${VERSION}\"" "$path" \
            || ! grep -qxF "    sha256 \"${mac_hash}\"" "$path" \
            || ! grep -qxF "    sha256 \"${linux_hash}\"" "$path"; then
            echo "::error::Failed to update $path, check its format"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git diff --cached --quiet || git commit -m "brew: restguard ${VERSION}"
          for i in 1 2 3 4 5; do
            git push && break
            if [ "$i" = 5 ]; then echo "::error::git push failed"; exit 1; fi
            git pull --rebase
            sleep 5
          done

  # Tell HansTanzi/apt to regenerate the APT repo: it downloads the .deb from each app's latest Release, signs them and deploys to GitHub Pages.
  # The signing key lives only in the apt repo. Requires secret APT_DISPATCH_TOKEN (a fine-grained PAT limited to HansTanzi/apt with only Actions read/write;
  # don't grant Contents write, or a leaked token could edit apps.txt to publish arbitrary packages); skipped if unset. Skipped for pre-releases
  apt:
    needs: [prepare, build-linux]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.build-linux.result) && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger APT repository update
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::APT_DISPATCH_TOKEN is not set"
            exit 0
          fi
          gh workflow run publish.yml -R HansTanzi/apt

  # Open a new-version PR on microsoft/winget-pkgs; winget-releaser reads the installers from the Release itself.
  # Requires repo secret WINGET_TOKEN (classic PAT, public_repo scope); skipped for pre-releases
  winget:
    needs: [prepare, build-windows]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.build-windows.result) && !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # Skip if the token isn't set, the package isn't in winget-pkgs yet (the first version must be submitted manually, see README),
      # this version already exists, or a PR is already pending
      - name: Check winget
        id: winget
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          function Skip($message) {
            Write-Host "::notice::$message"
            "submit=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if (-not $env:WINGET_TOKEN) { Skip "WINGET_TOKEN is not set" }
          $dir = "repos/microsoft/winget-pkgs/contents/manifests/h/HansTanzi/RestGuard"
          gh api $dir --silent 2>$null
          if ($LASTEXITCODE -ne 0) { Skip "HansTanzi.RestGuard does not exist in microsoft/winget-pkgs, submit the first version manually" }
          gh api "$dir/$env:VERSION" --silent 2>$null
          if ($LASTEXITCODE -eq 0) { Skip "HansTanzi.RestGuard $env:VERSION already exists in microsoft/winget-pkgs" }
          $prs = gh pr list -R microsoft/winget-pkgs --state open --search "HansTanzi.RestGuard $env:VERSION in:title" --json number --jq length
          if ($LASTEXITCODE -ne 0) { throw "Failed to query winget-pkgs PRs" }
          if ([int]$prs -gt 0) { Skip "An open PR for HansTanzi.RestGuard $env:VERSION already exists in microsoft/winget-pkgs" }
          "submit=true" >> $env:GITHUB_OUTPUT

      - uses: vedantmgoyal9/winget-releaser@v2
        if: steps.winget.outputs.submit == 'true'
        with:
          identifier: HansTanzi.RestGuard
          version: ${{ env.VERSION }}
          release-tag: ${{ github.ref_name }}
          installers-regex: '_x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  # Microsoft Store package: unsigned (the Store signs it) and not added to the Release; kept as a build artifact for manual upload to Partner Center.
  # Store submission is manual and can't be checked, so always package the exe from the Release. The Store doesn't support pre-release versions, so those are skipped
  msix:
    needs: [prepare, build-windows]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.build-windows.result) && !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Put it in the build output location, where msix.ps1 -SkipBuild picks up the exe
      - name: Download asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "RestGuard_${{ needs.prepare.outputs.version }}_x64.exe"
          gh release download "${{ github.ref_name }}" --pattern $name --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "Failed to download $name" }
          New-Item -ItemType Directory -Force src-tauri/target/release | Out-Null
          Copy-Item "$env:RUNNER_TEMP/$name" src-tauri/target/release/restguard.exe

      - name: Build MSIX
        shell: pwsh
        run: ./scripts/msix.ps1 -SkipBuild

      - uses: actions/upload-artifact@v7
        with:
          name: msix
          path: src-tauri/target/msix/*.msix
