# cargo-deny config, run by .github/workflows/dependencies.yml and locally with `cargo deny check` in src-tauri/
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check every platform we ship, not just the host, so Windows- and macOS-only crates are covered too
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
all-features = true

# Known vulnerabilities, unmaintained and yanked crates, from the RustSec advisory database
[advisories]
# Unmaintained crates deep in the Tauri/GTK tree can't be replaced by us; only flag those we depend on directly
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # Add an advisory id here only with a comment explaining why it doesn't affect us, e.g.
    # { id = "RUSTSEC-0000-0000", reason = "..." },
]

# Every license must be on this list. The app ships as MIT OR Apache-2.0, so strong copyleft (GPL, AGPL) is not allowed
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    # File-level copyleft; fine as long as we don't modify the MPL files themselves
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# Duplicate versions are common in the Tauri tree and harmless, so only warn
[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

# Only crates from crates.io. A git or alternative registry dependency bypasses crates.io's checks and
# yanking, so it needs a deliberate exception here
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
