name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -ne $conf) { throw "Tag $version does not match tauri.conf.json version $conf" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - run: pnpm install --frozen-lockfile

      # Scoop 安装便携版 exe，不需要安装包
      - run: pnpm tauri build --no-bundle

      - name: Prepare asset
        id: asset
        shell: pwsh
        run: |
          $name = "RestGuard_${{ steps.version.outputs.version }}_x64.exe"
          Copy-Item src-tauri/target/release/restguard.exe $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "name=$name" >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.asset.outputs.name }}
          generate_release_notes: true

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: default-branch

      - name: Update Scoop manifest
        shell: pwsh
        working-directory: default-branch
        run: |
          $path = "bucket/restguard.json"
          $manifest = Get-Content $path -Raw | ConvertFrom-Json
          $manifest.version = "${{ steps.version.outputs.version }}"
          $manifest.architecture."64bit".url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.asset.outputs.name }}#/RestGuard.exe"
          $manifest.architecture."64bit".hash = "${{ steps.asset.outputs.hash }}"
          ($manifest | ConvertTo-Json -Depth 10) + "`n" | Set-Content $path -NoNewline
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path
          git diff --cached --quiet || git commit -m "scoop: restguard ${{ steps.version.outputs.version }}"
          git push
