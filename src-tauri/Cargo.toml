[package]
name = "restguard"
version = "0.1.3"
description = "Cross-platform break reminder that actually makes you rest"
authors = ["Tanzi"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/HansTanzi/RestGuard"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "restguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sys-locale = "0.3"

# 与 tauri 使用的版本一致，用于把遮罩提升到菜单栏和全屏应用之上，以及检测前台应用
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSWorkspace", "NSRunningApplication"] }

# 与 tauri 使用的版本一致，用于商店（MSIX）版的开机自启，以及检测前台应用和麦克风占用
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["ApplicationModel", "Foundation", "Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
