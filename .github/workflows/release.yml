name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# 两个阶段：
# 1. build-*：编译并上传 GitHub Release 文件。文件已存在时跳过：构建不可复现，重编会改变哈希，
#    导致已更新的各渠道清单校验失败
# 2. 分发渠道（scoop、homebrew、apt、winget、msix）：各自一个 job，互不依赖，只从 Release 下载文件，
#    各自检查本渠道是否需要更新。只要对应平台的 Release 文件就绪，一个渠道失败不影响其他渠道
jobs:
  # 校验版本号，确保 Release 存在（让两个 build job 无需相互等待），并检查各平台文件是否已上传
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      windows_exists: ${{ steps.check.outputs.windows_exists }}
      macos_exists: ${{ steps.check.outputs.macos_exists }}
      linux_exists: ${{ steps.check.outputs.linux_exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version and existing assets
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$version" != "$conf" ]; then
            echo "::error::Tag $version does not match tauri.conf.json version $conf"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          # 一个平台的所有文件都已存在才跳过该平台的编译
          check() {
            platform="$1"; shift
            for name in "$@"; do
              if ! grep -qxF "$name" <<< "$assets"; then
                echo "${platform}_exists=false" >> "$GITHUB_OUTPUT"
                return
              fi
            done
            echo "::notice::$* already exist in release $GITHUB_REF_NAME, skipping $platform build"
            echo "${platform}_exists=true" >> "$GITHUB_OUTPUT"
          }
          check windows "RestGuard_${version}_x64.exe"
          check macos "RestGuard_${version}_universal.zip"
          check linux "RestGuard_${version}_amd64.deb" "RestGuard_${version}_x86_64.rpm" "RestGuard_${version}_x86_64.pkg.tar.zst"

  build-windows:
    needs: prepare
    if: needs.prepare.outputs.windows_exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Scoop 安装便携版 exe，不需要安装包
      - run: pnpm tauri build --no-bundle

      # 不加 --clobber：文件已存在时上传失败，绝不覆盖已发布的文件
      - name: Upload asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "RestGuard_${{ needs.prepare.outputs.version }}_x64.exe"
          Copy-Item src-tauri/target/release/restguard.exe $name
          gh release upload "${{ github.ref_name }}" $name
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload $name" }

  build-macos:
    needs: prepare
    if: needs.prepare.outputs.macos_exists == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # 同时支持 Apple Silicon 和 Intel 的通用版 .app
      - run: pnpm tauri build --target universal-apple-darwin --bundles app

      # 不加 --clobber：文件已存在时上传失败，绝不覆盖已发布的文件
      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="RestGuard_${{ needs.prepare.outputs.version }}_universal.zip"
          ditto -c -k --keepParent src-tauri/target/universal-apple-darwin/release/bundle/macos/RestGuard.app "$name"
          gh release upload "$GITHUB_REF_NAME" "$name"

  build-linux:
    needs: prepare
    if: needs.prepare.outputs.linux_exists == 'false'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 的 Linux 构建依赖：webkit2gtk、托盘用的 appindicator 等
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # x86_64 的 .deb（Debian/Ubuntu）和 .rpm（Fedora/openSUSE），都使用系统的 webkit2gtk
      - run: pnpm tauri build --bundles deb rpm

      # README 和 HansTanzi/apt 里写的是 apt install rest-guard（Tauri 由 productName 生成的包名），变了要同步改文档
      - name: Check deb package name
        run: |
          package=$(dpkg-deb -f "src-tauri/target/release/bundle/deb/RestGuard_${{ needs.prepare.outputs.version }}_amd64.deb" Package)
          if [ "$package" != "rest-guard" ]; then
            echo "::error::Package name is $package, expected rest-guard; update the apt install commands in the READMEs"
            exit 1
          fi

      # Arch 的 .pkg.tar.zst，由 .deb 重新打包
      - run: bash scripts/arch-package.sh "${{ needs.prepare.outputs.version }}"

      # 只上传 Release 上还没有的文件（比如上次只传成功了一个），不加 --clobber，绝不覆盖
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Tauri 的 rpm 文件名是 RestGuard-<版本>-1.x86_64.rpm 的格式，改成与其他平台一致的命名
          rpms=(src-tauri/target/release/bundle/rpm/*.rpm)
          if [ "${#rpms[@]}" != 1 ]; then
            echo "::error::Expected exactly one rpm, found: ${rpms[*]}"
            exit 1
          fi
          cp "${rpms[0]}" "RestGuard_${VERSION}_x86_64.rpm"

          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for file in \
            "src-tauri/target/release/bundle/deb/RestGuard_${VERSION}_amd64.deb" \
            "RestGuard_${VERSION}_x86_64.rpm" \
            "RestGuard_${VERSION}_x86_64.pkg.tar.zst"; do
            if grep -qxF "$(basename "$file")" <<< "$assets"; then
              echo "::notice::$(basename "$file") already exists, not uploading"
            else
              gh release upload "$GITHUB_REF_NAME" "$file"
            fi
          done

  # 直接更新 HansTanzi/scoop-bucket（用户添加的 bucket），发布后立即可用，不用等它的 Excavator 定时任务。
  # 用该仓库的 deploy key（secret SCOOP_BUCKET_DEPLOY_KEY，需写权限）推送到其默认分支。
  # 清单已是此版本和哈希时（比如 Excavator 抢先更新了）不提交。
  # 只替换 version、url、hash 三处文本，保留 Excavator 的 JSON 格式，避免两边来回改格式。
  # 推送被拒绝（Excavator 同时提交）时，重置到远端最新再改一遍，而不是 rebase（两边改的是同几行，会冲突）
  scoop:
    needs: [prepare, build-windows]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.build-windows.result) }}
    runs-on: ubuntu-latest
    steps:
      # 私钥有密码或格式不对时 ssh 会无限等待输入，用超时让它尽快失败
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          repository: HansTanzi/scoop-bucket
          ssh-key: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}

      - name: Update Scoop manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $name = "RestGuard_${env:VERSION}_x64.exe"
          gh release download "${{ github.ref_name }}" -R "${{ github.repository }}" --pattern $name --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "Failed to download $name" }
          $hash = (Get-FileHash "$env:RUNNER_TEMP/$name" -Algorithm SHA256).Hash.ToLower()
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$name#/RestGuard.exe"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $path = "bucket/restguard.json"
          for ($i = 1; $i -le 5; $i++) {
            git fetch origin
            git reset --hard "@{u}"
            if ($LASTEXITCODE -ne 0) { throw "git reset failed" }

            # autoupdate 里的 url 含 $version，不会被 url 的替换匹配到
            $text = Get-Content $path -Raw
            $text = $text -replace '(?m)^(\s*"version":\s*")[^"]*', "`${1}$env:VERSION"
            $text = $text -replace '(?m)^(\s*"url":\s*")[^"$]*(")', "`${1}$url`${2}"
            $text = $text -replace '(?m)^(\s*"hash":\s*")[^"]*', "`${1}$hash"
            $manifest = $text | ConvertFrom-Json
            if ($manifest.version -ne $env:VERSION -or $manifest.architecture."64bit".url -ne $url -or $manifest.architecture."64bit".hash -ne $hash) {
              throw "Failed to update $path, check its format"
            }
            Set-Content $path $text -NoNewline

            git add $path
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { Write-Host "::notice::$path is already at $env:VERSION"; break }
            git commit -m "restguard: Update to version $env:VERSION"
            git push
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 5) { throw "git push failed" }
            Start-Sleep 5
          }

  # 直接更新 HansTanzi/homebrew-tap（用户添加的 tap），用该仓库的 deploy key
  # （secret HOMEBREW_TAP_DEPLOY_KEY，需写权限）推送到其默认分支。
  # cask 已是此版本和哈希时 git diff 为空，不会提交；推送被拒绝时 rebase 后重试。
  # 同一个 cask 在 macOS 上装 .app，在 Linux 上取 Arch 包里的 usr/bin/restguard，版本号共用，所以要等两个平台都就绪
  homebrew:
    needs: [prepare, build-macos, build-linux]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.build-macos.result) && contains(fromJSON('["success", "skipped"]'), needs.build-linux.result) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          repository: HansTanzi/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sha() {
            gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --pattern "$1" --dir "$RUNNER_TEMP"
            sha256sum "$RUNNER_TEMP/$1" | cut -d ' ' -f 1
          }
          mac_hash=$(sha "RestGuard_${VERSION}_universal.zip")
          linux_hash=$(sha "RestGuard_${VERSION}_x86_64.pkg.tar.zst")

          # 两个 sha256 分别在 on_macos 和 on_linux 块里，按所在的块替换
          path="Casks/restguard.rb"
          sed -i -E \
            -e "s/^(  version \")[^\"]+/\1${VERSION}/" \
            -e "/^  on_macos do/,/^  end/ s/^(    sha256 \")[^\"]+/\1${mac_hash}/" \
            -e "/^  on_linux do/,/^  end/ s/^(    sha256 \")[^\"]+/\1${linux_hash}/" \
            "$path"
          if ! grep -qxF "  version \"${VERSION}\"" "$path" \
            || ! grep -qxF "    sha256 \"${mac_hash}\"" "$path" \
            || ! grep -qxF "    sha256 \"${linux_hash}\"" "$path"; then
            echo "::error::Failed to update $path, check its format"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git diff --cached --quiet || git commit -m "brew: restguard ${VERSION}"
          for i in 1 2 3 4 5; do
            git push && break
            if [ "$i" = 5 ]; then echo "::error::git push failed"; exit 1; fi
            git pull --rebase
            sleep 5
          done

  # 通知 HansTanzi/apt 重新生成 APT 源：它从各应用的最新 Release 下载 .deb，签名后部署到 GitHub Pages。
  # 签名密钥只在 apt 仓库中。需要 secret APT_DISPATCH_TOKEN（仅限 HansTanzi/apt、只有 Actions 读写权限的
  # fine-grained PAT；不要给 Contents 写权限，否则令牌泄露后可改 apps.txt 发布任意包），未配置时跳过。预发布版本跳过
  apt:
    needs: [prepare, build-linux]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.build-linux.result) && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger APT repository update
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::APT_DISPATCH_TOKEN is not set"
            exit 0
          fi
          gh workflow run publish.yml -R HansTanzi/apt

  # 向 microsoft/winget-pkgs 提交新版本 PR，winget-releaser 自行从 Release 读取安装文件。
  # 需要仓库 secret WINGET_TOKEN（classic PAT，public_repo 权限），预发布版本跳过
  winget:
    needs: [prepare, build-windows]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.build-windows.result) && !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # 未配置 token、包还不存在于 winget-pkgs（首个版本需手动提交，见 README）、
      # 已有此版本或已有待合并的 PR 时跳过
      - name: Check winget
        id: winget
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          function Skip($message) {
            Write-Host "::notice::$message"
            "submit=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if (-not $env:WINGET_TOKEN) { Skip "WINGET_TOKEN is not set" }
          $dir = "repos/microsoft/winget-pkgs/contents/manifests/h/HansTanzi/RestGuard"
          gh api $dir --silent 2>$null
          if ($LASTEXITCODE -ne 0) { Skip "HansTanzi.RestGuard does not exist in microsoft/winget-pkgs, submit the first version manually" }
          gh api "$dir/$env:VERSION" --silent 2>$null
          if ($LASTEXITCODE -eq 0) { Skip "HansTanzi.RestGuard $env:VERSION already exists in microsoft/winget-pkgs" }
          $prs = gh pr list -R microsoft/winget-pkgs --state open --search "HansTanzi.RestGuard $env:VERSION in:title" --json number --jq length
          if ($LASTEXITCODE -ne 0) { throw "Failed to query winget-pkgs PRs" }
          if ([int]$prs -gt 0) { Skip "An open PR for HansTanzi.RestGuard $env:VERSION already exists in microsoft/winget-pkgs" }
          "submit=true" >> $env:GITHUB_OUTPUT

      - uses: vedantmgoyal9/winget-releaser@v2
        if: steps.winget.outputs.submit == 'true'
        with:
          identifier: HansTanzi.RestGuard
          version: ${{ env.VERSION }}
          release-tag: ${{ github.ref_name }}
          installers-regex: '_x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  # 微软商店包：未签名（由商店签名），不放进 Release，作为构建产物供手动上传到合作伙伴中心。
  # 商店提交是手动的，无从检查，每次都用 Release 上的 exe 打包。商店不支持预发布版本号，预发布版本跳过
  msix:
    needs: [prepare, build-windows]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.build-windows.result) && !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 放到构建输出位置，msix.ps1 -SkipBuild 从这里取 exe
      - name: Download asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "RestGuard_${{ needs.prepare.outputs.version }}_x64.exe"
          gh release download "${{ github.ref_name }}" --pattern $name --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "Failed to download $name" }
          New-Item -ItemType Directory -Force src-tauri/target/release | Out-Null
          Copy-Item "$env:RUNNER_TEMP/$name" src-tauri/target/release/restguard.exe

      - name: Build MSIX
        shell: pwsh
        run: ./scripts/msix.ps1 -SkipBuild

      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: src-tauri/target/msix/*.msix
